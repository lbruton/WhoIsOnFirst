# ============================================
# WhoIsOnFirst - Production (Portainer GitOps)
# ============================================
# Deployed via Portainer stack from GitHub repo.
# GitOps redeploy rebuilds the image but preserves
# the named volume — your database survives redeploys.
#
# The same file runs two stacks on one host (WOF-42):
#   whoisonfirst      (refs/heads/main) — defaults below
#   whoisonfirst-dev  (refs/heads/dev)  — stack env sets
#     CONTAINER_NAME=whoisonfirst-dev, HOST_PORT=8901,
#     APP_ENV=dev, SMS_ALLOWED_NUMBERS=<owner's cell>
# Volumes are prefixed by the stack name, so each stack
# gets its own database.
# ============================================

services:
  whoisonfirst:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-whoisonfirst}
    restart: unless-stopped

    # Host port — NPM proxies the LAN hostname to this port
    ports:
      - "${HOST_PORT:-8900}:8000"

    # Named volume — persists across GitOps redeploys
    volumes:
      - whoisonfirst-data:/app/data

    # Environment variables injected via Portainer stack config
    environment:
      - DATABASE_URL=sqlite:///./data/whoisonfirst.db
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - NOTIFICATION_TIMEZONE=${NOTIFICATION_TIMEZONE:-America/Chicago}
      - NOTIFICATION_HOUR=${NOTIFICATION_HOUR:-8}
      - NOTIFICATION_MINUTE=${NOTIFICATION_MINUTE:-0}
      - SECRET_KEY=${SECRET_KEY}
      - SECURE_COOKIES=true
      # Unset in prod. The dev stack sets both; with APP_ENV=dev and live
      # Twilio, an empty allowlist blocks every send (fail closed).
      - APP_ENV=${APP_ENV:-prod}
      - SMS_ALLOWED_NUMBERS=${SMS_ALLOWED_NUMBERS:-}

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume — survives container rebuilds and GitOps redeploys
volumes:
  whoisonfirst-data:
    driver: local
