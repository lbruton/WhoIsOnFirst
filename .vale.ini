# Vale lints the prose-core rule on project docs, UI pages and Python comments and docstrings. The
# Prose style is deployed by skills-deploy (vale:Prose in .claude/project.json); edit it in
# Devops/skill-library/vale/styles/Prose. .context/voice.md names the exempt files.
StylesPath = .vale/styles
MinAlertLevel = warning

[{README.md,.context/*.md,DocVault/*.md,DocVault/Runbooks/*.md,src/**/*.py,scripts/*.py,frontend/*.html}]
BasedOnStyles = Prose

# Sprint notes, research and the WHO-to-WOF map are dated records that cite issue IDs. The style guide
# page is a design reference. The hidden folders hold deployed copies.
[{DocVault/Sprints/**,DocVault/Research/**,DocVault/Issue-Migration-WHO-to-WOF.md,frontend/styleguide.html,tests/**,.claude/**,.agents/**,.codex/**}]
BasedOnStyles =

# The PRD and the roadmap track planned work by issue ID.
[{DocVault/PRD.md,DocVault/Roadmap.md}]
Prose.IssueID = NO
